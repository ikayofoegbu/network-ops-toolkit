[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-ops-toolkit"
version = "0.1.0"
description = "Safe, single-target network diagnostics for an engineering portfolio"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
netops = "netops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
